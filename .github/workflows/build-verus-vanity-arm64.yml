name: Build ARM64 Verus Vanity

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to upload into
        required: true
        default: v1.0.9

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployment repo
        uses: actions/checkout@v4

      - name: Install ARM64 compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install Rust ARM64 target
        run: rustup target add aarch64-unknown-linux-gnu

      - name: Clone Darktron Verus vanity v3
        run: |
          git clone --depth 1 \
            https://github.com/Darktron/verus-vanity.git \
            source

      - name: Configure cross linker
        run: |
          mkdir -p source/.cargo
          cat > source/.cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build ARM64 release
        working-directory: source
        run: |
          cargo build --release \
            --target aarch64-unknown-linux-gnu

      - name: Prepare asset
        run: |
          cp \
            source/target/aarch64-unknown-linux-gnu/release/verus-vanity \
            verus-vanity-arm64

          chmod +x verus-vanity-arm64
          file verus-vanity-arm64

      - name: Upload to existing GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          gh release upload "$TAG" \
            verus-vanity-arm64 \
            --clobber \
            --repo "${{ github.repository }}"
